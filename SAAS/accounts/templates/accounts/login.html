{% extends "base.html" %}
{% block content %}
<div>
    {% if messages %}
    <ul>
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">log in</button>
    </form>

    <a href="{% url 'register' %}"><button type="button">nieuw account</button></a>
</div>
{% endblock content %}
