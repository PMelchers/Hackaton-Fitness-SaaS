{% extends "base.html" %}
{% block content %}
<div class="p-5">

        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="mt-[20px] w-[200px] h-[40px] rounded-[20px] bg-sky-500 text-white">account aanmaken</button>
    </form>

    <a href="{% url 'login' %}"><button type="button" class="mt-[10px] w-[200px] h-[40px] rounded-[20px] bg-white text-black border-gray border-[2px] border-solid">annuleren</button></a>
</div>
{% endblock content %}
